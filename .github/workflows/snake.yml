name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:
  push:
    branches:
      - master   # keep as-is (change only if your default branch is main)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ---------------------------
      # Checkout repository
      # ---------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------
      # 1. Generate GitHub Snake
      # (UNCHANGED LOGIC)
      # ---------------------------
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Abdul8081
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # ---------------------------
      # 2. Generate GitHub Metrics (FIX for broken images)
      # ---------------------------
      - name: Generate GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Abdul8081
          base: header, activity, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_activity: yes
          filename: dist/metrics.svg

      # ---------------------------
      # 3. Publish assets to output branch
      # (UNCHANGED PUBLISH MECHANISM)
      # ---------------------------
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
